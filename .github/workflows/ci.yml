# Type-checks and builds every push and pull request. After that, pushes to `beta` deploy to
# https://previewartwork-beta.lannahirave.com and pushes to `main` deploy to
# https://previewartwork.lannahirave.com.
#
# Repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see README.md, "Build and deploy").
name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch at a time. A newer push waits instead of cancelling a deploy halfway.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'beta')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'beta' }}
      url: ${{ github.ref_name == 'main' && 'https://previewartwork.lannahirave.com' || 'https://previewartwork-beta.lannahirave.com' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The build records `git rev-parse HEAD` for the footer's source link, so it is the pushed commit.
      - name: Build
        run: npm run ${{ github.ref_name == 'beta' && 'build:beta' || 'build' }}
      - name: Deploy to Cloudflare
        run: npx wrangler deploy ${{ github.ref_name == 'beta' && '--env beta' || '' }} --message "$GITHUB_REF_NAME $GITHUB_SHA"
